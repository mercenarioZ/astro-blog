<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" role="img" aria-labelledby="title desc">
  <title id="title">CLI and Vim editorial command sheet</title>
  <desc id="desc">A quiet command-line workflow typeset as overlapping printed sheets.</desc>
  <defs>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".8" fill="#f6edda" opacity=".05"/>
      <circle cx="15" cy="17" r=".7" fill="#f6edda" opacity=".04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0e0c0a" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="742" fill="#25211d"/>
  <rect width="1200" height="742" fill="url(#grain)"/>
  <path d="M87 96H1113M87 646H1113" stroke="#f6edda" stroke-width="1" opacity=".42"/>

  <text x="87" y="72" fill="#f6edda" font-family="Georgia,serif" font-size="23" font-weight="700">The quiet surface</text>
  <text x="1113" y="72" text-anchor="end" fill="#c9bda9" font-family="monospace" font-size="14" letter-spacing="3">CLI × VIM</text>

  <g filter="url(#shadow)">
    <path d="M142 154H662V576H142Z" fill="#f4e9d4"/>
    <path d="M616 202H1057V530H616Z" fill="#dfcfb4"/>
  </g>

  <text x="176" y="236" fill="#b54d2e" font-family="monospace" font-size="25">$ rg --files</text>
  <text x="176" y="302" fill="#29231d" font-family="monospace" font-size="25">$ git status --short</text>
  <text x="176" y="368" fill="#29231d" font-family="monospace" font-size="25">$ vim notes.md</text>
  <path d="M176 406H624" stroke="#867969" stroke-width="1"/>
  <text x="176" y="458" fill="#29231d" font-family="Georgia,serif" font-size="34" font-weight="700">One prompt.</text>
  <text x="176" y="505" fill="#29231d" font-family="Georgia,serif" font-size="34" font-weight="700">One clear next action.</text>

  <text x="662" y="276" fill="#b54d2e" font-family="Georgia,serif" font-size="118" font-weight="700">:</text>
  <text x="750" y="292" fill="#29231d" font-family="monospace" font-size="37">w</text>
  <text x="750" y="369" fill="#29231d" font-family="monospace" font-size="37">q</text>
  <text x="750" y="446" fill="#29231d" font-family="monospace" font-size="37">wq</text>
  <path d="M718 320H998M718 397H998M718 474H998" stroke="#867969" stroke-width="1"/>

  <path d="M93 129V176M70 152H116" stroke="#b54d2e" stroke-width="2"/>
  <rect x="1032" y="553" width="22" height="48" fill="#b54d2e"/>
  <circle cx="87" cy="646" r="7" fill="#768271"/>
</svg>
